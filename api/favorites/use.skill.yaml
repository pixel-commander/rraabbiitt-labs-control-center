instructions: GET /api/favorites/get lists favorites. Optional id selects one. POST
  /api/favorites/set accepts only {id}, a positive numeric ID already in records. The server copies
  current House metadata and upserts one favorite per record. DELETE /api/favorites/delete?id=ID
  removes that favorite and is idempotent. Responses use status complete/error and response.
  Favorites do not train ranking or change model feedback.
