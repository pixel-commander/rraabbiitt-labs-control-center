instructions: >-
  Run commands from the project root (the folder containing package.json), using Node.js 24 or
  newer.

  Run npm install to install the project dependencies.

  To add a runtime dependency, run npm install <package>. For a development dependency, run npm
  install -D <package>. Replace <package> with the requested package name.

  Keep the resulting package.json and package-lock.json changes together. If installation fails,
  report the npm error; after adding a package, run npm run build to check the project.
