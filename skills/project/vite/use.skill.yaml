instructions:
  Edit vite.config.mjs at the project root. It reads the root rab.project.json when
  Vite starts. Keep exactly one path entry named "startup model". Vite uses its folder to find the
  platform-specific Python executable under .venv and sets TOOL_LEARNER_PYTHON before importing the
  API plugins. This lookup selects the Python environment. The model settings file is separate. The
  "database" entry supplies the database folder and filename. After changing startup settings,
  launch a fresh Vite process and check the affected API route.
