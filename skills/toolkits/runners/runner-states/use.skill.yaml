instructions:
  "Use the shared execution status values: waiting, complete and error. Waiting means no
  terminal result has been recorded; a started invocation may have date_start before it has
  date_end. A UI running indicator can derive from timing but must not invent a stored status value.
  Complete means execution returned successfully; inspect response findings and optional diagnostics
  separately. Error means execution failed and requires its error message and any preserved partial
  results. Do not represent a validation finding as an operational failure unless the capability
  contract defines that behavior. Do not claim canceled, paused or skipped states are supported
  without an explicit host contract. A failed child must remain visible in the parent workflow
  result."
