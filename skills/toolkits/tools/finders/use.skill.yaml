instructions:
  A finder locates subjects within an explicit scope using its declared matching rules.
  Read the intended source of truth and do not silently substitute a filesystem scan for a database
  lookup. Use query consistently where that is the declared search field. Return matching House path
  or record values with enough identity and location to use the result. No matches is a valid empty
  result, distinct from an inaccessible source or malformed request. Preserve ordering and
  pagination when promised. Do not alter records, refresh indexes or execute the found subjects as a
  side effect.
