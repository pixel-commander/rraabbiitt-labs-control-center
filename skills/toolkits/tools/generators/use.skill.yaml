instructions:
  A generator produces derived records, values or content from explicit inputs. Reuse
  House fields and the category's declared output shape. Keep generation separate from unrelated
  discovery, execution and persistence. If the generator saves output, require and honor its
  declared destination; otherwise return the result without writing. Preserve supplied identities
  unless generating a new identity is the explicit purpose. Report the generated content or records
  rather than an unrelated success wrapper. Validate deterministic transformations with
  representative inputs, including absent optional values and empty collections. The shared runner
  owns execution tracking.
