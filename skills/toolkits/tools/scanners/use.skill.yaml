instructions:
  A scanner walks the selected scope and reports discovered subjects and per-path
  problems. Respect declared exclusions and symlink behavior; do not broaden from a project root to
  a drive. State whether the specific scanner only returns an inventory or explicitly persists an
  index. Preserve record IDs during discovery and refresh. Keep valid results distinguishable from
  incomplete or failed paths, and do not infer complete totals from partial inspection. Destructive
  rebuild behavior must be part of the declared operation. Scanning must be requested rather than
  hidden inside an unrelated lookup. The shared runner owns tracking.
