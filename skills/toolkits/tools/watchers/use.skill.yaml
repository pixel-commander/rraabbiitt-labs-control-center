instructions:
  A watcher observes a declared source and responds only to relevant changes. Declare
  how it starts, stops, filters events and cleans up listeners or resources. Coalesce repeated
  events where needed and avoid reacting indefinitely to its own output. Keep observation separate
  from unrequested indexing or execution. Surface operational errors and make shutdown reliable. Any
  work dispatched from events uses the established shared execution owner rather than a private
  tracker. Document initial-load behavior and whether starting the watcher itself performs work; do
  not conceal a startup scan.
