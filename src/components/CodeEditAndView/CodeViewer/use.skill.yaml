instructions: >-
  Props

  code (required): string

  language (optional): string | undefined

  mode (optional): "view" | "edit" | undefined

  inline (optional): boolean | undefined

  showLineNumbers (optional): boolean | undefined

  showMinimap (optional): boolean | undefined

  startLine (optional): number | undefined

  activeLine (optional): number | undefined

  tabSize (optional): number | undefined

  disabled (optional): boolean | undefined

  diagnostics (optional): CodeDiagnostic[] | undefined

  className (optional): string | undefined

  container_class (optional): string | undefined

  style (optional): CSSProperties | undefined

  aria-label (optional): string | undefined

  handleChange (optional): HandlerKey<{ code: string; }, "code-change", void, CodeViewerProps> |
  undefined

  handleClick (optional): HandlerKey<{ line: number; }, "line-click" | "minimap-navigate", void,
  CodeViewerProps> | undefined

  id (optional): number | undefined

  name (optional): string | undefined

  title (optional): string | undefined

  description (optional): string | undefined

  path (optional): string | undefined

  save_path (optional): string | undefined

  save_file (optional): string | undefined

  paths (optional): PathsProps[] | undefined

  date_added (optional): number | undefined

  date_updated (optional): number | undefined

  date_used (optional): number | undefined

  date (optional): number | undefined

  date_start (optional): number | undefined

  date_end (optional): number | undefined


  Defaults

  language="tsx"; mode="view"; inline=false; showLineNumbers=true; showMinimap=true; startLine=1;
  tabSize=2; disabled=false; diagnostics=[]. aria-label defaults to Code editor in edit mode and
  Code in view mode.


  Callbacks and prop behavior

  code is required. mode accepts view/edit. language selects syntax. inline, showLineNumbers,
  showMinimap, startLine, activeLine, tabSize, disabled and diagnostics configure the viewer.
  diagnostics entries contain message, severity error/warning and optional line/column.
  container_class, className, style and aria-label customize display. handleChange receives ({code},
  "code-change", props). handleClick receives ({line}, "line-click" | "minimap-navigate", props).
