instructions: Call useCodeViewer(props) inside CodeViewer. Owns the local
  vendored editor lifecycle, controlled document synchronization, viewport
  reporting and sampled minimap. Returns root/editor/canvas refs and minimap
  navigation handlers. The caller owns code and persistence. Callbacks receive
  data, type and the full CodeViewerProps bag. No source code executes and no
  external editor service runs.
