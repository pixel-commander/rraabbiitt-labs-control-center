instructions: Call await validateCode({ code, file, language }). Returns
  diagnostics with severity, message and optional source line/column.
  JS/TS/JSX/TSX uses the lazily loaded TypeScript transpiler for syntax checks;
  JSON uses JSON parsing. Other languages return no built-in diagnostics. This
  is not project-wide semantic type checking; supply
  CodeEditAndView.handleValidate for that. Code is not executed.
