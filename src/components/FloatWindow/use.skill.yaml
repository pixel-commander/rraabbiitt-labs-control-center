instructions: >-
  Render FloatWindow inside a positioned parent with a defined height. Pass rect
  as x,y,width,height in pixels. Parent owns rect and open; apply handleChange
  values on move/resize and handleClose to hide. Supports title, actions,
  children, canDrag, canResize, className and HouseKeys. No persistence or
  application state.
