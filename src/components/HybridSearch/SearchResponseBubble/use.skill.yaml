  date_start (optional): number | undefined

  date_end (optional): number | undefined

  side (optional): "left" | "right" | undefined

  status (optional): "sent" | "read" | undefined


  Defaults

  side="left"; status="sent" for left messages; user_class="container-alt";
  model_class="container-alt"; className="". Left title defaults to Model; right title always
  displays User.


  Callbacks and prop behavior

  date is required numeric milliseconds. children is required message content. side accepts left or
  right. title is shown on left; right always displays User. Both show the time. Footer accepts
  ReactNode. status accepts sent or read on left only. user_class styles right content; model_class
  styles left content. No callbacks.
