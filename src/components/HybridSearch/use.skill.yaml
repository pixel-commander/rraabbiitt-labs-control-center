instructions: "Props: optional mode (hybrid by default or dumbot), HouseKeys and className. Optional rabbitEffects is a parent-owned ref populated by the background head handleReady callback; the existing query handleChange enables seven circuit arcs while text changes and clears the override one second after typing stops or on unmount. DumBot mode offers an outlined Rephrase button beside Run that previews the draft through the model responder without submitting it. DumBot mode ranks DB-pairs and slots, hides grading and lets users select a result to fill requirements. Saves submitted user messages before calling the registered hybrid search API. Shows the top result title and description in the main header and remaining ranked cards in the right scroll. Explicit votes save whole-result lessons tied to the saved message and query. Callbacks: none accepted. Errors are displayed; no preview results substitute for failed requests."
