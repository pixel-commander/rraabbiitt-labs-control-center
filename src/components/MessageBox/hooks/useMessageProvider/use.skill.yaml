instructions: "Props: the message-box prop bag; handleSubmit is required. value optionally controls
  the message; handleChange is optional. Defaults: empty local message, unless value is supplied.
  Callbacks: returned handleChange(text, type = message-box, bag = props) updates an uncontrolled
  message and forwards the change callback. Returned handleSubmit(text = message, type =
  message-box, bag = props) trims text, rejects blank input, invokes the submit callback with the
  complete supplied bag, and clears only an uncontrolled message. Returns message, handleChange and
  handleSubmit."
