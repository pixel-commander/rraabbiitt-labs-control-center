<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HTML and Dev layout demo</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--surface-app);
        color: var(--content-default);
      }
      :root {
        --content-disabled: #58647a;
        --code-gutter: #58647a;
        --motion-fast: 140ms ease-out;
        --action-ghost-background: linear-gradient(
          180deg,
          #0b0e14 0%,
          #06070b 100%
        );
        --action-main-shadow:
          inset 0 1px 0 rgb(255 255 255 / 7%), 0 2px 5px rgb(0 0 0 / 42%);
        --code-keyword: #ff5fdd;
        --code-atrule: #ff8ee6;
        --code-default: #dfe4ee;
        --border-danger: #ffb454;
        --container-float-background: linear-gradient(
          180deg,
          #202637 0%,
          #11151f 100%
        );
        --success-default: rgb(var(--color-tertiary-rgb));
        --type-label: 600 0.75rem/1.25 "Rajdhani", system-ui, sans-serif;
        --surface-float: #1a2030;
        --space-xl: 1.5rem;
        --border-subtle: #212838;
        --border-style: solid;
        --type-heading: 700 1.125rem/1.1 "Rajdhani", system-ui, sans-serif;
        --elevation-inset:
          inset 0 1px 0 rgb(255 255 255 / 4%), inset 0 4px 14px rgb(0 0 0 / 62%);
        --container-main-shadow:
          inset 0 1px 0 rgb(255 255 255 / 6%), 0 0 0 1px #05060a;
        --action-muted-shadow: var(--elevation-inset);
        --action-fill-alt-gradient-top: rgba(0, 0, 0, 0);
        --type-body: 400 0.8125rem/1.45 "Roboto", system-ui, sans-serif;
        --container-inset-border: var(--border-width) var(--border-style)
          var(--border-default);
        --surface-hover: #232b3c;
        --effect-float: var(--elevation-float);
        --surface-inset: #07090d;
        --motion-default: 220ms ease;
        --color-tertiary-rgb: 63, 224, 129;
        --surface-selected: #32132f;
        --radius-round: 50%;
        --type-code: 400 0.75rem/1.5 "JetBrains Mono", ui-monospace, monospace;
        --color-secondary-rgb: 41, 182, 255;
        --container-main-border: var(--border-width) var(--border-style)
          var(--border-default);
        --code-function: #5fc8ff;
        --space-lg: 1rem;
        --accent-secondary: rgb(var(--color-secondary-rgb));
        --space-2xl: 2rem;
        --surface-active: #2e3545;
        --code-selection: rgb(255 46 209 / 24%);
        --action-main-background: linear-gradient(
          180deg,
          #171c29 0%,
          #0d1017 100%
        );
        --action-fill-alt-gradient-bottom: rgba(0, 0, 0, 0);
        --action-muted-hover-background: linear-gradient(
          180deg,
          #151a25 0%,
          #0b0e14 100%
        );
        --content-muted: #98a1b3;
        --code-gutter-active: #ffd2f3;
        --space-xs: 0.375rem;
        --radius-container: 0.5rem;
        --border-default: #2e3545;
        --elevation-float:
          0 0 0 1px #05060a, 0 12px 32px rgb(0 0 0 / 48%),
          0 0 24px rgb(255 46 209 / 8%);
        --code-punctuation: #98a1b3;
        --surface-disabled: #0a0c11;
        --color-primary-rgb: 255, 46, 209;
        --border-strong: #4a566d;
        --surface-main: #12151f;
        --danger-soft: #2c1a08;
        --surface-app: #010207;
        --surface-scrim: rgb(1 2 7 / 78%);
        --container-float-border: var(--border-width) var(--border-style)
          var(--border-default);
        --radius-control: 0.25rem;
        --action-main-hover-background: linear-gradient(
          180deg,
          #242b3d 0%,
          #141925 100%
        );
        --surface-transparent: transparent;
        --space-md: 0.75rem;
        --content-strong: #f7f3fa;
        --container-main-background: linear-gradient(
          180deg,
          #151925 0%,
          #0d1017 100%
        );
        --effect-inset: var(--elevation-inset);
        --space-2xs: 0.25rem;
        --code-comment: #6fba82;
        --action-muted-background: linear-gradient(
          180deg,
          #0b0e14 0%,
          #06070b 100%
        );
        --content-default: #dfe4ee;
        --focus-ring: 2px solid var(--border-focus);
        --color-quaternary-rgb: 255, 180, 84;
        --code-number: #6ff0a8;
        --code-line-active: rgb(255 255 255 / 4%);
        --focus-offset: 2px;
        --container-inset-background: linear-gradient(
          180deg,
          #080a0f 0%,
          #05060a 100%
        );
        --code-property: #a9e2ff;
        --code-custom-prop: #29b6ff;
        --content-danger: #ffd9a8;
        --danger-default: #ffb454;
        --code-string: #ffb454;
        --content-accent: #ffd2f3;
        --disabled-opacity: 0.58;
        --accent-soft: #35102f;
        --action-main-hover-border-color: var(--border-strong);
        --accent-default: #ff2ed1;
        --border-focus: var(--accent-secondary);
        --action-main-border: var(--border-width) var(--border-style)
          var(--border-default);
        --space-sm: 0.5rem;
        --border-width: 1px;
        --content-inverse: #010207;
      }

      .demo-card {
        box-sizing: border-box;
        width: 240px;
        height: 160px;
        display: flex;
        gap: 0px;
        padding: 0px;
        background: var(--surface-main);
        color: var(--content-default);
        border: 1px solid var(--border-default);
        border-radius: 24px;
        font-size: 16px;
        font-weight: 400;
        white-space: pre-wrap;
        opacity: 1;
        box-shadow: none;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="demo-card">Real HTML. Real layout.</div>
    <div class="demo-card">Second instance</div>
  </body>
</html>
