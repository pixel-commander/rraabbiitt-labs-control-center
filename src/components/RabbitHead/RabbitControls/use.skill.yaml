  "instructions": "Render inside a positioned parent. Under RabbitProvider, render with no props: values, rectangle, visibility and handlers come from the nearest provider. Explicit props override provider defaults, including false and empty values. Without a provider supply values, rect and handlers. FloatWindow open, handleChange and handleClose pass through. handleSlider receives (number, slider, Slider props); props.name is the renderer property key. handleClick receives (action, rabbit-control, complete props). Actions: lightning, flood, arcs, showPulses, showSparkles, autoMotion, reset. Parent owns settings, rectangle and visibility. Default title is Rabbit controls. className is composed. No persistence. Pulse sliders use pulseFreq (0–40), pulseSize (0.25–4), pulseTravel (1–20), pulseSpeed (0.1–5); the showPulses action toggles visibility. Colors use handleClick with {name: renderer color property, value: hex string}, rabbit-control, and complete props. useMono toggles monochrome. Color controls cover faceColor, lineColor, fxColor, circuitColor, circuitCoreColor, circuitGlowColor, strikeColor, floodColor, monoColor."
