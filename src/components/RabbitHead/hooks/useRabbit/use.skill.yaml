instructions: >-
  Use the owner hook for an independent head and popup. For a shared head, mount RabbitProvider
  once and consume useRabbitContext in the shell and pages. Spread values onto the head and
  attach handleReady. handleSettings merges partial flat renderer props, ignoring undefined
  and preserving false, zero and empty strings. effects.current exposes runtime effects.
  Initial values, popup open state and rectangle are read on mount. Reset restores initial values.
