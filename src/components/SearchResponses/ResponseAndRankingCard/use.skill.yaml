  paths (optional): PathsProps[] | undefined

  date_added (optional): number | undefined

  date_updated (optional): number | undefined

  date_used (optional): number | undefined

  date (optional): number | undefined

  date_start (optional): number | undefined

  date_end (optional): number | undefined


  Defaults

  rank=1; score=0; title=name; action_class="action-outline"; className="".


  Callbacks and prop behavior

  rank and score are numbers; score displays two decimals. name is metadata text; id is numeric;
  title accepts ReactNode. action_class styles Rephrase only; hand-vote buttons have no action atom.
  handleClick receives (data, "good-vote" | "ok-vote" | "bad-vote" | "rephrase", props). children
  optionally adds content between heading and actions. container_class defaults to
  container-side-rail; an empty string removes the skin. favorite defaults to false. The star is at
  the footer right. Clicking it calls handleClick(data, "favorite", complete props). The parent owns
  favorites and persistence. Each footer control has a tooltip.
