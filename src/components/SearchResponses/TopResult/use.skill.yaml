instructions: result_type is top-result. title and children accept ReactNode. name, type and numeric
  id provide metadata. score defaults to 0 and displays two decimals. container_class defaults to
  container-main on the center card; an empty string removes the skin. container_aton remains the
  fallback when container_class is absent. action_class defaults to action-outline for Rephrase.
  color overrides all four rails; className applies to the outer grid. disabled and vote pass to the
  shared controls. handleClick receives (data, good-vote | ok-vote | bad-vote | rephrase, complete
  original incoming props). Parent owns feedback and persistence. favorite defaults to false. The
  star is at the footer right. Clicking it calls handleClick(data, "favorite", complete props). The
  parent owns favorites and persistence. Each footer control has a tooltip.
