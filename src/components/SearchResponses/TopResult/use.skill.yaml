  date_updated (optional): number | undefined

  date_used (optional): number | undefined

  date (optional): number | undefined

  date_start (optional): number | undefined

  date_end (optional): number | undefined


  Defaults

  container_class="container-side-rail" unless the legacy container_aton is supplied; className="".


  Callbacks and prop behavior

  result_type must be top-result when using SearchResponses. title and children accept ReactNode.
  container_class selects the container; empty string removes it. container_aton is the legacy
  fallback. color overrides the rail color. handleClick receives (data, "good-vote" | "ok-vote" |
  "bad-vote" | "rephrase", props).


  score is optional. When supplied, it is displayed to two decimals in the left heading slot. Zero
  is preserved. If omitted, no score box is rendered.
