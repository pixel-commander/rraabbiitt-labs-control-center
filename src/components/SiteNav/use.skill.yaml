instructions: >-
  Props

  Logo (optional): ReactNode

  name (required): ReactNode

  Left (optional): ReactNode

  nav_items (optional): SiteNavItem[] | undefined

  Right (optional): ReactNode

  handleClick (required): HandlerKey<SiteNavItem, "site-nav", void, SiteNavProps>

  selected (optional): string | undefined

  render (optional): ((item: SiteNavItem, type: "nav-item") => ReactNode) | undefined

  className (optional): string | undefined

  title (optional): string | undefined

  id (optional): number | undefined

  description (optional): string | undefined

  path (optional): string | undefined

  save_path (optional): string | undefined

  save_file (optional): string | undefined

  paths (optional): PathsProps[] | undefined

  date_added (optional): number | undefined

  date_updated (optional): number | undefined

  date_used (optional): number | undefined

  date (optional): number | undefined

  date_start (optional): number | undefined

  date_end (optional): number | undefined


  Defaults

  nav_items=[]; className=""; title="Site navigation" for the accessible label when omitted.


  Callbacks and prop behavior

  name and handleClick are required. nav_items contain numeric id, ReactNode label, string path,
  optional title and handleClick. Selection uses selected matching the item path. Item handleClick
  takes precedence over the main handleClick; callbacks receive (item, "site-nav", props).
  render(item, "nav-item") replaces item rendering. Logo, Left and Right accept ReactNode.
