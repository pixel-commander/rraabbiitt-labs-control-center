  date_end (optional): number | undefined


  Defaults

  min=0; max=100; step=1; value=0; slider_class="slider-main"; className=""; is_disabled=false;
  is_visible=true.


  Callbacks and prop behavior

  value is controlled. handleChange receives (number, "slider", props). min/max bound the value;
  step controls increments. threshold marks a limit. label names the input; color overrides the
  accent. is_disabled prevents changes; is_visible=false renders nothing. slider_class selects the
  slider skin.
