instructions: Render StatusBar with status text, optional color and className. delay
  and duration are milliseconds, defaulting to 0 and 3000. is_open defaults to false;
  true keeps the message open without a duration timer. duration 0 also disables timed
  dismissal. The close button always hides the message, clears timers and calls handleClick(status,
  "close", props), including when is_open is true. Visibility uses a DOM ref and the
  is-open class, not React state. Changing status, delay, duration or is_open reapplies
  visibility. Uses the side-right grid with message in main and close in side. No
  fixed height.
