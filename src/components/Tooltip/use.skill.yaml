instructions: >-
  Props

  targetRef (required): RefObject<Element | null>

  content (optional): ReactNode

  title (optional): ReactNode

  children (optional): ReactNode

  placement (optional): SmartTooltipPlacement | undefined

  disabled (optional): boolean | undefined

  positionRef (optional): RefObject<SmartTooltipPosition | null> | undefined

  className (optional): string | undefined

  container_class (optional): string | undefined

  id (optional): number | undefined

  name (optional): string | undefined

  description (optional): string | undefined

  path (optional): string | undefined

  save_path (optional): string | undefined

  save_file (optional): string | undefined

  paths (optional): PathsProps[] | undefined

  date_added (optional): number | undefined

  date_updated (optional): number | undefined

  date_used (optional): number | undefined

  date (optional): number | undefined

  date_start (optional): number | undefined

  date_end (optional): number | undefined


  Defaults

  container_class="container-neg"; className=""; placement="above"; disabled=false; children=null.


  Callbacks and prop behavior

  targetRef is required. content is the body; children is the fallback when content is undefined.
  title is an optional heading. placement accepts above, below, left, right, before and after.
  disabled hides the tooltip. container_class may be an atom or custom class; an empty string
  removes the wrapper default.
