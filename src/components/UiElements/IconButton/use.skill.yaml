  date_used (optional): number | undefined

  date (optional): number | undefined

  date_start (optional): number | undefined

  date_end (optional): number | undefined


  Defaults

  disabled=false; action_atom="action-main"; className="".


  Callbacks and prop behavior

  children is the text. Icon accepts ReactNode and takes precedence over type. type currently
  accepts add. Supply Icon or type. handleClick receives (mouseEvent, "icon-button", props);
  disabled prevents it. title supplies the title and accessible label. action_atom accepts an action
  class.
