instructions: >-
  Supply required absolute root and optional save (default true). First discovers all folders, then three asynchronous workers read direct files. Uses the shared ignored-folder list. Returns House paths and summary counts. Complete scans atomically replace only that root in discovery; partial scans keep previous rows. File name includes its extension; type is the extension without a dot. Run through the shared dispatcher.
