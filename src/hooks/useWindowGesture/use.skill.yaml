name: use-window-gesture
type: skill
path: src/hooks/useWindowGesture
file: use.skill.yaml
instructions: >-
  Call useWindowGesture(rootRef, options) from a React component. Options
  contain the controlled rect, viewport boolean (default false, bounds use
  offsetParent), handleChange(rect, move-or-resize), and optional
  handleEnd(rect, gestureType). Attach begin(event, move-or-resize,
  optionalInitialRect) to a drag handle. Pointer capture and listeners are
  cleaned up on release, cancellation, target disappearance or unmount. This
  hook emits geometry; the parent owns the rect.
