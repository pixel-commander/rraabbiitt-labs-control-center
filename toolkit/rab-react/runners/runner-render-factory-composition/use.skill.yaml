instructions: Call run with one settings bag. type selects component, subcomponent, page, or dashboard.
  Supply name, path (project root), code as one JSX root element, and css as a stylesheet string.
  title, description, save_path and tags pass through. The runner resolves the registered
  component (1793138966741), subcomponent (1793138966746), page (1793138966755), or dashboard (1793138966759) runner.
  It scaffolds the selected artifact, then replaces only its return expression and imported
  stylesheet. Existing props, imports, type definitions and defaults remain in place.
  Existing artifacts return overwrite confirmation. Pass overwrite true and the matching id
  to update without rerunning the scaffold. Returns flat RunnerReturn receipts.
