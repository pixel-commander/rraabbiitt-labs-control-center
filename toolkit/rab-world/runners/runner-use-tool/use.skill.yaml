instructions:
  Supply toolkits from the root rab.world.json toolkits registration. Each toolkit requires an
  absolute path. The project database locates IDs. Current adjacent settings are read before loading. A missing ID refreshes the catalog, then falls back to discovery inside the supplied toolkits. Successful scaffolds refresh catalog registration. query searches current tool and
  runner rab.settings.json records inside those folders by case-insensitive terms in name, title and
  description. Every query term must match; there is no result limit. Templates, dependencies and
  symlinks are skipped. id reads a matching registration and adjacent usage skill. An ID outside the
  supplied toolkits errors. Supply id and content (JSON settings object string) to execute after
  inspection. Execution remains constrained to the registered toolkit and entry folder. Missing
  toolkits errors; an empty array lists no tools. The shared runTools owner provides timing and flat
  tracking. Preserve the incoming settings bag.
