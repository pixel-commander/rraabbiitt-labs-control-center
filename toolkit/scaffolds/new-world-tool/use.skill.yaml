instructions: >
  Supply path (existing destination parent) and name (lowercase hyphenated). Optional
  file is name.ts, name.js or name.mjs. title and description default only when absent.
  Returns scaffold ToolReturn with two generated files, both using the same new numeric ID.
  Existing destinations are refused. Tool input and return types use the House contract.
  Usage is reported silently after execution with numeric id, date and optional message DB ID.
  Usage failure is appended to error without changing the tool status or result.
