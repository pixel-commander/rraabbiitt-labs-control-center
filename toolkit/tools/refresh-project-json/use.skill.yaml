instructions: Call the exported run({ path }) with one HouseKeys settings bag. path is required and
  names the folder containing rab.project.json; do not include the filename. ID-only lookup is not
  available yet. Returns ToolReturn. On success, status is complete, settings is the incoming bag,
  and response contains the updated saved JSON record. response.paths contains beacon summaries with
  id, name, type, tags and path. response.summary.count is the number of paths. response.id is the
  saved record ID; an absent or null ID is assigned automatically, and an existing ID is retained.
  On failure, status is error, settings is the incoming bag, and error describes the failure.
  response.path is updated to the target JSON file's actual absolute containing folder, without the
  filename.
